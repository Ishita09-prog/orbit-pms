# Render Blueprint: creates the PostgreSQL database and the API in one step.
# Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: pms-db
    plan: free
    databaseName: pms
    user: pms

services:
  - type: web
    name: pms-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        sync: false   # set to your deployed web URL, e.g. https://orbit-pms.vercel.app
