# One command: `docker compose up --build`
#   web      -> http://localhost:8080
#   API      -> http://localhost:4000   (docs: /api/docs)
#   postgres -> localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://pms:pms@db:5432/pms
      JWT_SECRET: ${JWT_SECRET:-docker-compose-demo-secret-please-change-0123456789}
      CORS_ORIGINS: http://localhost:8080
      TRUST_PROXY: 0
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SHOW_DEMO: "true"
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
